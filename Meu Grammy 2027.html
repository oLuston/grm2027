<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Grammy 2027</title>
<style>
:root{--bg:#faf6ee;--fg:#1b1710;--mut:#6f6652;--card:#fff;--line:#e3d9c0;--gold:#b8860b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c08;--fg:#f6efdc;--mut:#a39880;--card:#1a160e;--line:#352d1c;--gold:#e8b931;--on:#0e0c08}}
:root[data-theme="dark"]{--bg:#0e0c08;--fg:#f6efdc;--mut:#a39880;--card:#1a160e;--line:#352d1c;--gold:#e8b931;--on:#0e0c08}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:clamp(28px,6vw,44px);margin:0 0 4px;letter-spacing:.5px}
h1 span{color:var(--gold)}
.sub{color:var(--mut);margin:0 0 22px;font-family:system-ui,sans-serif;font-size:15px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.cnt{font:13px system-ui,sans-serif;color:var(--mut);margin-bottom:18px}
h2{font-size:clamp(22px,4.5vw,30px);margin:0 0 16px}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.opt{text-align:left;background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;transition:.15s}
.opt:hover{border-color:var(--gold);transform:translateX(3px)}
.opt.sel{background:var(--gold);color:var(--on);border-color:var(--gold)}
.opt{display:flex;align-items:center;gap:12px}.opt img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}.opt b{display:block;font-size:18px}
.opt small{font:14px system-ui,sans-serif;opacity:.75}
.nav{display:flex;justify-content:space-between;margin-top:18px}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:8px 14px;font:14px system-ui,sans-serif}
.cta{background:var(--gold);color:var(--on);border:0;border-radius:9px;padding:10px 18px;font:600 15px system-ui,sans-serif}
.collage{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:dense;gap:8px;margin:20px 0}
.t{border-radius:10px;padding:12px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;box-shadow:0 3px 10px #0004}
.t:nth-child(3n+1){transform:rotate(-1.2deg)}.t:nth-child(3n+2){transform:rotate(1deg)}
.t.big{grid-column:span 2;grid-row:span 2;min-height:270px;order:-1;border:2px solid var(--gold);padding:18px;transform:none}
.t:nth-child(7n+3){grid-column:span 2}
.t em{font:11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.8px;opacity:.8;font-style:normal;margin-bottom:auto}
.t b{font-size:15px;line-height:1.15}
.t.big b{font-size:30px}.t.big small{font-size:15px}.t.big em{font-size:13px}
.t small{font:12px system-ui,sans-serif;opacity:.85;margin-top:3px}
.dl{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.dl[hidden]{display:none}
.cover{text-align:center;padding:36px 0 10px}
.cover h2{font-size:clamp(26px,6vw,38px)}
@media(max-width:560px){.collage{grid-template-columns:repeat(2,1fr)}.t.big{min-height:230px}}
</style>
</head>

const imgOf=o=>{const s=(o[0]+" "+o[1]).toLowerCase();for(const [re,u] of ART)if(re.test(s))return u;return null};
const app=document.getElementById("app");
let i=0,picks=[];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function head(){return '<h1>Grammy <span>2027</span></h1><p class="sub">69º Grammy Awards · 7 de fevereiro de 2027 · Escolha seu campeão em cada categoria</p>'}
function render(){
 if(i>=D.length) return end();
 const [cat,opts]=D[i];
 app.innerHTML=head()+`<div class="bar"><i style="width:${i/D.length*100}%"></i></div><div class="cnt">Categoria ${i+1} de ${D.length}</div><h2>${esc(cat)}</h2><div class="opts">`+
 opts.map((o,k)=>`<button class="opt${picks[i]===k?" sel":""}" data-k="${k}">${imgOf(o)?`<img src="${imgOf(o)}" alt="">`:""}<div><b>${esc(o[0])}</b>${o[1]?`<small>${esc(o[1])}</small>`:""}</div></button>`).join("")+
 `</div><div class="nav"><button class="ghost" id="back" ${i?"":"disabled style='opacity:.4'"}>← Voltar</button><button class="ghost" id="skip">Pular →</button></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picks[i]=+b.dataset.k;b.classList.add("sel");setTimeout(()=>{i++;render()},220)});
 document.getElementById("back").onclick=()=>{if(i){i--;render()}};
 document.getElementById("skip").onclick=()=>{i++;render()};
 window.scrollTo(0,0);
}
function end(){
 const tiles=D.map((d,n)=>{const k=picks[n];if(k===undefined)return"";const o=d[1][k];
  return `<div class="t${n==1||n==2?" big":""}" style="background:${imgOf(o)?`linear-gradient(to top,#000c,#0000 65%),url(${imgOf(o)}) center/cover`:`linear-gradient(145deg,${COLORS[(n*3+k)%COLORS.length]})`}"><em>${esc(d[0])}</em><b>${esc(o[0])}</b>${o[1]?`<small>${esc(o[1])}</small>`:""}</div>`}).join("");
 app.innerHTML=`<div class="cover"><h1>Meu Grammy <span>2027</span></h1><p class="sub">Esses são os meus campeões</p></div>`+(tiles?`<div class="collage">${tiles}</div>`:'<p class="sub">Você não escolheu nenhum campeão.</p>')+
 `<div class="dl" id="dl" hidden><button class="cta" data-f="v">⬇ Baixar vertical (1080×1920)</button><button class="cta" data-f="h">⬇ Baixar horizontal (1920×1080)</button></div><p class="sub" id="dlmsg" style="min-height:20px"></p><div class="nav"><button class="ghost" id="back">← Revisar</button><button class="cta" id="again">Recomeçar</button></div>`;
 document.getElementById("back").onclick=()=>{i=D.length-1;render()};
 document.getElementById("again").onclick=()=>{picks=[];i=0;render()};
 setupDl();
 window.scrollTo(0,0);
}
const loadImg=u=>new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=u});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,t,mw){const out=[];let line="";for(const w of t.split(/\s+/)){const tt=line?line+" "+w:w;if(c.measureText(tt).width>mw&&line){out.push(line);line=w}else line=tt}if(line)out.push(line);return out}
async function makePNG(fmt){
 const P=fmt==="v",W=P?1080:1920,H=P?1920:1080,pad=40,gap=12,C=P?4:7;
 const items=[];D.forEach((d,n)=>{const k=picks[n];if(k!==undefined)items.push({n,k,cat:d[0],o:d[1][k],big:n==1||n==2})});
 items.sort((a,b)=>b.big-a.big);
 const occ=[];let rows=0;
 items.forEach(it=>{const s=it.big?2:1;for(let r=0;;r++){for(let c=0;c<=C-s;c++){let ok=true;for(let y=0;y<s&&ok;y++)for(let x=0;x<s;x++)if(occ[r+y]&&occ[r+y][c+x]){ok=false;break}
  if(ok){for(let y=0;y<s;y++){occ[r+y]=occ[r+y]||[];for(let x=0;x<s;x++)occ[r+y][c+x]=1}it.r=r;it.c=c;it.s=s;rows=Math.max(rows,r+s);return}}}});
 const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
 g.fillStyle="#0e0c08";g.fillRect(0,0,W,H);
 g.textBaseline="alphabetic";g.textAlign="center";
 const tf=P?72:60;g.font=`700 ${tf}px Georgia, serif`;
 const a="Meu Grammy ",b="2027",wa=g.measureText(a).width,wb=g.measureText(b).width,x0=W/2-(wa+wb)/2;
 g.textAlign="left";g.fillStyle="#f6efdc";g.fillText(a,x0,pad+tf);g.fillStyle="#e8b931";g.fillText(b,x0+wa,pad+tf);
 g.textAlign="center";g.fillStyle="#a39880";g.font=`${P?26:22}px system-ui, sans-serif`;
 g.fillText("69º Grammy Awards · 7 de fevereiro de 2027",W/2,pad+tf+(P?44:38));
 const top=pad+tf+(P?44:38)+28,availH=H-top-pad,availW=W-2*pad;
 const cw=(availW-gap*(C-1))/C,ch=Math.min((availH-gap*(Math.max(rows,1)-1))/Math.max(rows,1),P?440:380);
 for(const it of items){
  const x=pad+it.c*(cw+gap),y=top+it.r*(ch+gap),w=it.s*cw+(it.s-1)*gap,h=it.s*ch+(it.s-1)*gap,u=imgOf(it.o);
  g.save();rr(g,x,y,w,h,18);g.clip();
  const im=u?await loadImg(u):null;
  if(im){const sc=Math.max(w/im.width,h/im.height),iw=im.width*sc,ih=im.height*sc;g.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
   const gr=g.createLinearGradient(0,y+h,0,y+h*0.3);gr.addColorStop(0,"rgba(0,0,0,.85)");gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(x,y,w,h)}
  else{const cs=COLORS[(it.n*3+it.k)%COLORS.length].split(",");const gr=g.createLinearGradient(x,y,x+w,y+h);gr.addColorStop(0,cs[0]);gr.addColorStop(1,cs[1]);g.fillStyle=gr;g.fillRect(x,y,w,h)}
  g.restore();
  if(it.big){g.strokeStyle="#e8b931";g.lineWidth=5;rr(g,x+2,y+2,w-4,h-4,17);g.stroke()}
  const ip=it.big?26:16,mw=w-2*ip;g.textAlign="left";g.fillStyle="#fff";
  const cf=it.big?(P?20:19):(P?14:13);g.font=`600 ${cf}px system-ui, sans-serif`;g.globalAlpha=.85;
  wrap(g,it.cat.toUpperCase(),mw).slice(0,2).forEach((l,i)=>g.fillText(l,x+ip,y+ip+cf+i*(cf+4)));g.globalAlpha=1;
  let ts=it.big?(P?46:40):(P?27:22),tl,lh;const art=it.o[1];const af=it.big?(P?24:22):(P?17:15);
  for(;;){g.font=`700 ${ts}px Georgia, serif`;tl=wrap(g,it.o[0],mw);lh=ts*1.15;if(tl.length*lh<=h*0.62||ts<14)break;ts-=2}
  g.font=`${af}px system-ui, sans-serif`;const al=art?wrap(g,art,mw).slice(0,2):[];
  let yy=y+h-ip-al.length*(af+4)+(al.length?0:0);
  g.globalAlpha=.9;al.forEach((l,i)=>g.fillText(l,x+ip,yy+af+i*(af+4)-2));g.globalAlpha=1;
  const ty=yy-6-(tl.length-1)*lh;g.font=`700 ${ts}px Georgia, serif`;
  tl.forEach((l,i)=>g.fillText(l,x+ip,ty+i*lh));
 }
 return await new Promise(r=>cv.toBlob(r,"image/png"));
}
async function setupDl(){
 let d=null;try{d=window.claude&&await claude.use("downloads")}catch(e){}
 const box=document.getElementById("dl"),msg=document.getElementById("dlmsg");
 if(!d||!box)return;box.hidden=false;
 box.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
  msg.textContent="Gerando imagem…";
  try{const blob=await makePNG(b.dataset.f);await d.save({filename:"meu-grammy-2027-"+(b.dataset.f==="v"?"vertical":"horizontal")+".png",data:blob});msg.textContent="Pronto!"}
  catch(e){msg.textContent=(e&&e.code==="declined")?"":"Não foi possível baixar agora. Você pode tirar um print da colagem."}
 });
}
render();
